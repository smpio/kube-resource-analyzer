name: Build and push Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      TAG_NAME: build-${{ github.run_number }}

    steps:
      - name: Compute short SHA
        run: echo "IMAGE_TAG=$(echo '${{ env.IMAGE_SHA }}' | cut -c1-7)" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for image
        id: meta
        run: |
          echo "tags=${{ env.REGISTRY }}/${{ github.repository }}:latest,${{ env.REGISTRY }}/${{ github.repository }}:build-${{ env.BUILD_NUMBER }},${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push git tag
        run: |
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/${{ env.TAG_NAME }}" >/dev/null; then
            echo "Tag '${{ env.TAG_NAME }}' already exists, skipping"
            exit 0
          fi
          git tag "${{ env.TAG_NAME }}" "${{ env.IMAGE_SHA }}"
          git push origin "refs/tags/${{ env.TAG_NAME }}"
