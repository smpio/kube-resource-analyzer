# Update every kube-kra workload to the image built by the preceding workflow.
name: K8s deploy

on:
  workflow_run:
    workflows:
      - Build and push Docker image
    types:
      - completed
    branches: [master]
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number to deploy
        required: false
        type: string
      verify_only:
        description: Verify OIDC authentication and infra write access without changing manifests
        required: false
        type: boolean
        default: false

jobs:
  update-infra-manifests:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_NUMBER: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_number || inputs.build_number }}
      IMAGE: ghcr.io/${{ github.repository }}:build-${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_number || inputs.build_number }}

    steps:
      - name: Validate build number
        if: ${{ inputs.verify_only != true }}
        run: |
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "A numeric build_number is required for deployment"
            exit 1
          fi

      - name: Get infra token
        id: infra-auth
        uses: smpio/gha-token-broker@bf2cbdf29cea8972ca744f3257b73c1a2a2d2d3b # v1.0.0
        with:
          broker-url: https://gha-token-broker.bind.pw

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: smpio/infra
          ref: master
          token: ${{ steps.infra-auth.outputs.token }}
          path: infra

      - name: Verify infra write access
        if: ${{ inputs.verify_only == true }}
        run: git -C infra push --dry-run origin HEAD:master

      - name: Update image references
        if: ${{ inputs.verify_only != true }}
        run: |
          matches=$(grep -rlE '^[[:space:]]*image:[[:space:]]*ghcr\.io/smpio/kube-resource-analyzer(:[^[:space:]]*)?[[:space:]]*$' infra/kube/kube-kra --include='*.yaml' --include='*.yml' || true)
          if [ -z "$matches" ]; then
            echo "No kube-kra image references found"
            exit 1
          fi
          while IFS= read -r manifest; do
            sed -E -i "s|^([[:space:]]*image:[[:space:]]*)ghcr\.io/smpio/kube-resource-analyzer(:[^[:space:]]*)?([[:space:]]*)$|\\1${IMAGE}\\3|" "$manifest"
          done <<EOF
          $matches
          EOF

      - name: Commit and push manifest changes
        if: ${{ inputs.verify_only != true }}
        run: |
          cd infra
          if git diff --quiet -- kube/kube-kra; then
            echo "Manifests already use build-${BUILD_NUMBER}"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add kube/kube-kra
          git commit -m "chore(kube-kra): update app image to build-${BUILD_NUMBER}"
          git push origin master
