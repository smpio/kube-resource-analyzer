name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEV_ENV: "no"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kra
      CACHE_URL: locmemcache://
      CELERY_BROKER_URL: ""
      CELERY_RESULT_BACKEND_URL: ""
      KUBE_IN_CLUSTER: "no"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.dev.lock

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.dev.lock

      - name: Run Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test
